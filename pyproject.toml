[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethelburg"
version = "0.3.0b1"
description = "Local workbench for investigating UK shell companies on Companies House data (FollowTheMoney v3.x)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "SOsintOps" }]
keywords = ["osint", "companies-house", "shell-companies", "followthemoney", "due-diligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",        # SQLite async driver (local backend)
    "alembic>=1.13",
    "asyncpg>=0.29",          # PostgreSQL async driver
    "psycopg2-binary>=2.9",   # PostgreSQL sync driver (for Alembic)

    # Configuration
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "keyring>=24.0",           # OS credential store (Windows Credential Manager)

    # ETL / Data
    "httpx[http2]>=0.27",      # async streaming downloads
    "aiofiles>=23.0",
    "orjson>=3.9",             # fast JSON for JSONL parsing
    "ijson>=3.2",              # streaming JSON parser for the PSC snapshot

    # Multi-script name normalisation (ADR-017)
    "jellyfish>=1.0",          # Phonetic keys (Beider-Morse fallback)
    # fingerprints / followthemoney: optional [ftm] extra (PyICU), fallbacks in src/core

    # Fuzzy matching
    "rapidfuzz>=3.6",

    # Geo
    "shapely>=2.0",
    "geoalchemy2>=0.14",       # PostGIS types for SQLAlchemy

    # Scheduling
    "apscheduler>=3.10",

    # Export
    "openpyxl>=3.1",           # XLSX
    "networkx>=3.2",           # GEXF, GraphML, centrality metrics

    # Web UI & CLI
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",             # report templates
    "typer>=0.12",
    "rich>=13.7",

    # Logging
    "structlog>=24.0",
]

[project.optional-dependencies]
# Both need PyICU (no Windows wheel for Python 3.13); src/core has pure-Python fallbacks
ftm = [
    "followthemoney>=3.5",
    "fingerprints>=0.5",       # CJK, Cyrillic, Arabic -> canonical ASCII
]
pdf = [
    "weasyprint>=62.0",        # not used yet: reports are printed to PDF from the browser
]
desktop = [
    "PySide6>=6.7",            # optional native window (LGPL); Edge/Chrome app window otherwise
]
ml = [
    "sentence-transformers>=2.7",  # all-MiniLM-L6-v2, 384-dim, Apache 2.0
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "detect-secrets>=1.4",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/SOsintOps/Aethelburg-project"
Changelog = "https://github.com/SOsintOps/Aethelburg-project/blob/main/CHANGELOG.md"
Issues = "https://github.com/SOsintOps/Aethelburg-project/issues"

[project.scripts]
aethelburg = "src.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
