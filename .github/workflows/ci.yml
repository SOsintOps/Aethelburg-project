name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "assets/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/**"]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e . pytest pytest-asyncio ruff
      - name: Lint
        run: python -m ruff check src tests config migrations
      - name: Test
        env:
          # an empty scratch database: the end-to-end test skips itself without data
          SQLITE_PATH: ${{ runner.temp }}/ci.sqlite
        run: python -m pytest -q -rs
