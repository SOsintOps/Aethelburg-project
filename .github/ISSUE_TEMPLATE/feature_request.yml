name: Feature request
description: A new source, detection rule, export or improvement
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The investigative task or question this would help with
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work; for a new data source, its publisher, licence and update frequency
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
