<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2b45"/>
      <stop offset="100%" stop-color="#061626"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c158"/>
      <stop offset="50%" stop-color="#c99e32"/>
      <stop offset="100%" stop-color="#9e781c"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7eed7"/>
      <stop offset="100%" stop-color="#e2d1a7"/>
    </linearGradient>
  </defs>

  <!-- Skyline Buildings (Left) -->
  <g stroke="#081b2e" stroke-width="4" stroke-linejoin="round">
    <!-- Far left cottage -->
    <polygon points="120,255 120,220 148,198 176,220 176,255" fill="#d5c29d"/>
    <polygon points="116,220 148,195 180,220" fill="#0d2b45"/>
    <!-- Timber house -->
    <rect x="172" y="195" width="44" height="60" fill="#e8dac0"/>
    <polygon points="168,195 194,168 220,195" fill="#0d2b45"/>
    <line x1="194" y1="195" x2="194" y2="255"/>
    <line x1="172" y1="225" x2="216" y2="225"/>
    <line x1="172" y1="195" x2="194" y2="225"/>
    <line x1="216" y1="195" x2="194" y2="225"/>
    <!-- Turret & Gable house -->
    <rect x="216" y="190" width="52" height="65" fill="#dfd0b2"/>
    <polygon points="232,190 242,162 252,190" fill="#0d2b45"/>
    <polygon points="264,255 264,182 296,152 328,182 328,255" fill="#cbb58b"/>
    <polygon points="260,182 296,148 332,182" fill="#0d2b45"/>
    <rect x="288" y="226" width="16" height="29" rx="8" fill="#0d2b45"/>
  </g>

  <!-- Skyline Buildings (Right) -->
  <g stroke="#081b2e" stroke-width="4" stroke-linejoin="round">
    <!-- Cathedral Spire -->
    <rect x="515" y="138" width="38" height="117" fill="#e5d6b8"/>
    <polygon points="512,138 534,68 556,138" fill="url(#goldGrad)"/>
    <rect x="529" y="152" width="10" height="24" rx="5" fill="#0d2b45"/>
    <!-- Inner town houses -->
    <rect x="455" y="185" width="52" height="70" fill="#cbb58b"/>
    <polygon points="451,185 481,158 511,185" fill="#0d2b45"/>
    <rect x="488" y="198" width="62" height="57" fill="#e8dac0"/>
    <polygon points="484,198 519,172 554,198" fill="#0d2b45"/>
    <!-- Right merchants -->
    <polygon points="555,255 555,192 582,166 609,192 609,255" fill="#d5c29d"/>
    <polygon points="551,192 582,162 613,192" fill="#0d2b45"/>
    <polygon points="604,255 604,184 634,156 664,184 664,255" fill="#cbb58b"/>
    <polygon points="600,184 634,152 668,184" fill="#0d2b45"/>
    <rect x="627" y="226" width="14" height="29" rx="7" fill="#0d2b45"/>
    <rect x="660" y="212" width="32" height="43" fill="#dfd0b2"/>
    <polygon points="656,212 676,192 696,212" fill="#0d2b45"/>
  </g>

  <!-- Windows -->
  <g fill="#0d2b45">
    <rect x="228" y="204" width="8" height="12"/>
    <rect x="246" y="204" width="8" height="12"/>
    <rect x="228" y="224" width="8" height="12"/>
    <rect x="246" y="224" width="8" height="12"/>
    <rect x="278" y="190" width="8" height="12"/>
    <rect x="304" y="190" width="8" height="12"/>
    <rect x="278" y="208" width="8" height="12"/>
    <rect x="304" y="208" width="8" height="12"/>
    <rect x="466" y="198" width="8" height="12"/>
    <rect x="466" y="218" width="8" height="12"/>
    <rect x="502" y="214" width="8" height="10"/>
    <rect x="518" y="214" width="8" height="10"/>
    <rect x="534" y="214" width="8" height="10"/>
    <rect x="618" y="192" width="8" height="12"/>
    <rect x="640" y="192" width="8" height="12"/>
  </g>

  <!-- Central Royal Charter Scroll -->
  <g stroke="#081b2e" stroke-width="4.5" stroke-linejoin="round">
    <!-- Top roll -->
    <path d="M 322,102 A 22,22 0 1,0 322,146 L 350,146 L 350,102 Z" fill="#cbb58b"/>
    <circle cx="322" cy="124" r="9" fill="#0d2b45"/>
    <!-- Main parchment body -->
    <path d="M 322,102 L 444,102 A 18,18 0 0,1 462,120 L 462,258 L 344,258 L 344,124 A 22,22 0 0,0 322,102 Z" fill="url(#parchment)"/>
    <!-- Text lines on scroll -->
    <line x1="362" y1="124" x2="442" y2="124" stroke="#0d2b45" stroke-width="4" stroke-linecap="round"/>
    <line x1="362" y1="138" x2="442" y2="138" stroke="#0d2b45" stroke-width="4" stroke-linecap="round"/>
    <line x1="362" y1="152" x2="442" y2="152" stroke="#0d2b45" stroke-width="4" stroke-linecap="round"/>
    <line x1="362" y1="166" x2="442" y2="166" stroke="#0d2b45" stroke-width="4" stroke-linecap="round"/>
    <!-- Heraldic Crossed Keys / Fleur-de-lis Emblem -->
    <path d="M 402,176 L 402,234 M 374,205 L 430,205 M 380,185 L 424,225 M 424,185 L 380,225" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="402" cy="205" r="8" fill="url(#goldGrad)" stroke="#081b2e" stroke-width="3"/>
    <!-- Bottom roll -->
    <path d="M 344,244 L 472,244 A 14,14 0 0,1 472,272 L 354,272 A 14,14 0 0,1 344,244 Z" fill="#dfd0b2"/>
  </g>

  <!-- Main Heraldic Shield / Cartouche -->
  <path d="M 68,255 L 732,255 C 712,272 710,315 706,365 C 702,382 676,386 668,402 C 625,436 510,468 400,486 C 290,468 175,436 132,402 C 124,386 98,382 94,365 C 90,315 88,272 68,255 Z"
        fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>

  <!-- Horizontal Divider inside Shield -->
  <line x1="135" y1="372" x2="665" y2="372" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.85"/>

  <!-- Typography: AETHELBURG -->
  <text x="400" y="346" text-anchor="middle" fill="#ffffff"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="70" letter-spacing="6">AETHELBURG</text>

  <!-- Typography: CHARTAE REGNI -->
  <text x="400" y="418" text-anchor="middle" fill="url(#goldGrad)"
        font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="31" letter-spacing="5">CHARTAE REGNI</text>
</svg>
